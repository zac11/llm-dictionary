<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="TheAIDictionary logo">
  <defs>
    <path id="np-arc" d="M 44 120 A 76 76 0 0 1 196 120"/>
  </defs>

  <!-- mint background -->
  <rect width="240" height="240" rx="56" fill="#d8f2e4"/>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#0e6b6b" stroke-opacity="0.18" stroke-width="2"/>

  <!-- arched wordmark -->
  <text font-family="'Quicksand', 'Nunito', 'Arial Rounded MT Bold', Verdana, sans-serif" font-weight="800" font-size="20" letter-spacing="1.5" fill="#0e6b6b">
    <textPath href="#np-arc" startOffset="50%" text-anchor="middle">TheAIDictionary</textPath>
  </text>

  <!-- microchip / book with circuit pattern -->
  <g transform="translate(120 126)">
    <rect x="-46" y="-32" width="92" height="64" rx="13" fill="#0e6b6b" fill-opacity="0.10" stroke="#0e6b6b" stroke-width="3"/>
    <rect x="-15" y="-15" width="30" height="30" rx="6" fill="none" stroke="#0e6b6b" stroke-width="2.5"/>
    <g stroke="#0e6b6b" stroke-width="2.5" stroke-linecap="round">
      <line x1="-46" y1="-18" x2="-58" y2="-18"/>
      <line x1="-46" y1="0" x2="-58" y2="0"/>
      <line x1="-46" y1="18" x2="-58" y2="18"/>
      <line x1="46" y1="-18" x2="58" y2="-18"/>
      <line x1="46" y1="0" x2="58" y2="0"/>
      <line x1="46" y1="18" x2="58" y2="18"/>
      <line x1="-18" y1="-32" x2="-18" y2="-44"/>
      <line x1="0" y1="-32" x2="0" y2="-44"/>
      <line x1="18" y1="-32" x2="18" y2="-44"/>
      <line x1="-18" y1="32" x2="-18" y2="44"/>
      <line x1="0" y1="32" x2="0" y2="44"/>
      <line x1="18" y1="32" x2="18" y2="44"/>
    </g>
  </g>
</svg>
