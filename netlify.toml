[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# The app is a single page: unknown paths fall back to it. Real files (the
# prerendered /term/<slug>/index.html share pages, /og.png, /assets/*) take
# precedence over redirects, so previews keep their per-term meta tags.
[[headers]]
  for = "/generated/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/generated/graph.*.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
